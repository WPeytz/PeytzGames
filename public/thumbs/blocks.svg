<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Blocks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151d"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- faint board grid -->
  <g stroke="#1d2230" stroke-width="1" opacity="0.7">
    <path d="M256 45 V405 M320 45 V405 M384 45 V405 M448 45 V405 M512 45 V405 M544 45 V405"/>
    <path d="M256 45 H544 M256 105 H544 M256 165 H544 M256 225 H544 M256 285 H544 M256 345 H544 M256 405 H544"/>
  </g>
  <rect x="256" y="45" width="288" height="360" fill="none" stroke="#2c3346" stroke-width="2" rx="6"/>

  <!-- falling piece (cyan S) -->
  <g fill="url(#cyan)">
    <rect x="321" y="106" width="58" height="58" rx="7"/>
    <rect x="385" y="106" width="58" height="58" rx="7"/>
    <rect x="385" y="170" width="58" height="58" rx="7"/>
    <rect x="449" y="170" width="58" height="58" rx="7"/>
  </g>

  <!-- settled stack (purple) -->
  <g fill="url(#purple)">
    <rect x="257" y="346" width="58" height="58" rx="7"/>
    <rect x="321" y="346" width="58" height="58" rx="7"/>
    <rect x="449" y="346" width="58" height="58" rx="7"/>
    <rect x="257" y="286" width="58" height="58" rx="7"/>
    <rect x="485" y="286" width="58" height="58" rx="7" opacity="0.9"/>
  </g>
  <g fill="url(#cyan)" opacity="0.85">
    <rect x="385" y="346" width="58" height="58" rx="7"/>
    <rect x="321" y="286" width="58" height="58" rx="7"/>
  </g>
</svg>
