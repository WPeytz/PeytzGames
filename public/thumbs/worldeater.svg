<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="World Eater">
  <defs>
    <radialGradient id="we-bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#12182a"/>
      <stop offset="1" stop-color="#070a12"/>
    </radialGradient>
    <radialGradient id="we-blob" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5ff0c8"/>
      <stop offset="1" stop-color="#2bbf90"/>
    </radialGradient>
    <radialGradient id="we-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="0.5" stop-color="#ff5b6e"/>
      <stop offset="1" stop-color="#7a1020"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#we-bg)"/>

  <!-- concentric world rings (regions), centered off to the left -->
  <g transform="translate(300 225)">
    <circle r="360" fill="#141824" opacity="0.9"/>
    <circle r="300" fill="#232733"/>
    <circle r="230" fill="#2b2b30"/>
    <circle r="165" fill="#33291f"/>
    <circle r="110" fill="#20361f"/>
    <circle r="62" fill="#2f5a2c"/>
    <circle r="360" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  </g>

  <!-- stars in the void -->
  <g fill="#eafff7">
    <circle cx="700" cy="60" r="2" opacity="0.7"/>
    <circle cx="620" cy="360" r="1.6" opacity="0.5"/>
    <circle cx="760" cy="240" r="1.8" opacity="0.6"/>
    <circle cx="90" cy="70" r="1.6" opacity="0.5"/>
  </g>

  <!-- prey scattered across the rings -->
  <!-- flower -->
  <g transform="translate(210 150)">
    <g fill="#e08fb0"><circle cx="0" cy="-9" r="6"/><circle cx="9" cy="-3" r="6"/><circle cx="6" cy="8" r="6"/><circle cx="-6" cy="8" r="6"/><circle cx="-9" cy="-3" r="6"/></g>
    <circle r="6" fill="#ffd24a"/>
  </g>
  <!-- tree -->
  <g transform="translate(430 120)">
    <rect x="-5" y="4" width="10" height="26" fill="#7a4d24"/>
    <circle cx="0" cy="-4" r="20" fill="#3f7d3f"/>
    <circle cx="-14" cy="4" r="14" fill="#3f7d3f"/>
    <circle cx="14" cy="4" r="14" fill="#3f7d3f"/>
  </g>
  <!-- little house -->
  <g transform="translate(150 300)">
    <rect x="-22" y="-6" width="44" height="34" fill="#d9b98a"/>
    <path d="M-28 -6 L28 -6 L0 -32 Z" fill="#b04c3a"/>
    <rect x="-6" y="8" width="12" height="20" fill="#6b4420"/>
  </g>
  <!-- car -->
  <g transform="translate(360 330)">
    <rect x="-30" y="-10" width="60" height="22" rx="7" fill="#4f7fd9"/>
    <rect x="-14" y="-22" width="28" height="16" rx="5" fill="#4f7fd9"/>
    <circle cx="-16" cy="14" r="8" fill="#111"/>
    <circle cx="16" cy="14" r="8" fill="#111"/>
  </g>

  <!-- the ominous World Core, outer ring -->
  <g transform="translate(470 300)">
    <circle r="46" fill="url(#we-core)" opacity="0.35"/>
    <g fill="#ff5b6e">
      <path d="M0 -30 L7 -10 L-7 -10 Z" transform="rotate(0)"/>
      <path d="M0 -30 L7 -10 L-7 -10 Z" transform="rotate(60)"/>
      <path d="M0 -30 L7 -10 L-7 -10 Z" transform="rotate(120)"/>
      <path d="M0 -30 L7 -10 L-7 -10 Z" transform="rotate(180)"/>
      <path d="M0 -30 L7 -10 L-7 -10 Z" transform="rotate(240)"/>
      <path d="M0 -30 L7 -10 L-7 -10 Z" transform="rotate(300)"/>
    </g>
    <circle r="22" fill="#7a1020"/>
    <circle r="9" fill="#ffd24a"/>
  </g>

  <!-- the player blob, mid-devour -->
  <g transform="translate(300 240)">
    <circle r="70" fill="#33d6a6" opacity="0.25"/>
    <circle r="54" fill="url(#we-blob)" stroke="#eafff7" stroke-width="4"/>
    <circle cx="20" cy="-10" r="11" fill="#0b1a16"/>
    <circle cx="20" cy="18" r="11" fill="#0b1a16"/>
  </g>

  <!-- title -->
  <text x="770" y="410" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="42" fill="#eafff7">World<tspan fill="#33d6a6">Eater</tspan></text>
</svg>
