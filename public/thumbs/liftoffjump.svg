<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Liftoff Jump">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#12151d"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8eaf2"/>
      <stop offset="0.75" stop-color="#cbd2e6"/>
      <stop offset="1" stop-color="#9aa3b5"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#e8eaf2">
    <circle cx="120" cy="70" r="2.2" opacity="0.8"/>
    <circle cx="250" cy="120" r="1.6" opacity="0.6"/>
    <circle cx="540" cy="60" r="2" opacity="0.7"/>
    <circle cx="700" cy="150" r="1.6" opacity="0.6"/>
    <circle cx="430" cy="40" r="1.4" opacity="0.5"/>
    <circle cx="330" cy="220" r="1.6" opacity="0.5"/>
    <circle cx="610" cy="250" r="1.8" opacity="0.55"/>
  </g>

  <!-- moon, top-right goal -->
  <circle cx="650" cy="95" r="78" fill="url(#moonglow)"/>
  <circle cx="650" cy="95" r="50" fill="url(#moon)"/>
  <g fill="#9aa3b5" opacity="0.5">
    <circle cx="634" cy="80" r="9"/>
    <circle cx="668" cy="104" r="6"/>
    <circle cx="642" cy="116" r="5"/>
  </g>

  <!-- platforms climbing up toward the moon -->
  <g fill="url(#plat)">
    <rect x="120" y="360" width="96" height="18" rx="9"/>
    <rect x="300" y="306" width="96" height="18" rx="9"/>
    <rect x="180" y="246" width="96" height="18" rx="9"/>
    <rect x="372" y="206" width="96" height="18" rx="9"/>
    <rect x="486" y="270" width="96" height="18" rx="9"/>
  </g>

  <!-- dashed bounce trajectory -->
  <path d="M168 352 Q250 300 348 298 Q300 250 228 238 Q330 200 420 198"
    fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="2 12" opacity="0.7"/>

  <!-- astronaut, mid-bounce above the highest platform -->
  <g transform="translate(420 150)">
    <ellipse cx="0" cy="34" rx="20" ry="6" fill="#0b0d12" opacity="0.4"/>
    <rect x="-16" y="-2" width="32" height="34" rx="13" fill="#e8eaf2"/>
    <circle cx="0" cy="-14" r="17" fill="#e8eaf2"/>
    <path d="M-13 -16 a13 11 0 0 1 26 0 z" fill="#22d3ee"/>
    <rect x="-22" y="2" width="9" height="20" rx="4.5" fill="#cbd2e6"/>
    <rect x="13" y="2" width="9" height="20" rx="4.5" fill="#cbd2e6"/>
  </g>
</svg>
