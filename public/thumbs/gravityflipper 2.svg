<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="GravityFlipper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151d"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="portal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- single-screen level frame -->
  <rect x="120" y="60" width="560" height="330" fill="none" stroke="#2c3346" stroke-width="2" rx="10"/>

  <!-- ceiling and floor platforms -->
  <rect x="120" y="60" width="560" height="26" fill="#1d2230" rx="6"/>
  <rect x="120" y="364" width="560" height="26" fill="#1d2230" rx="6"/>
  <g fill="#2c3346">
    <rect x="150" y="80" width="120" height="6" rx="3"/>
    <rect x="150" y="364" width="120" height="6" rx="3"/>
  </g>

  <!-- player cube, resting on the floor -->
  <rect x="186" y="306" width="56" height="56" rx="9" fill="url(#purple)"/>
  <rect x="200" y="320" width="12" height="12" rx="3" fill="#0b0d12" opacity="0.55"/>
  <rect x="220" y="320" width="12" height="12" rx="3" fill="#0b0d12" opacity="0.55"/>

  <!-- gravity flip arrows (down + up) -->
  <g transform="translate(380 225)">
    <g fill="#8b5cf6" opacity="0.9">
      <path d="M-86 -78 h26 v44 h22 l-35 40 -35 -40 h22 z"/>
    </g>
    <g fill="#22d3ee" opacity="0.9">
      <path d="M86 78 h-26 v-44 h-22 l35 -40 35 40 h-22 z"/>
    </g>
  </g>

  <!-- portal goal -->
  <circle cx="588" cy="334" r="58" fill="url(#portal)"/>
  <circle cx="588" cy="334" r="30" fill="none" stroke="url(#cyan)" stroke-width="7"/>
  <circle cx="588" cy="334" r="15" fill="none" stroke="#a78bfa" stroke-width="5" opacity="0.85"/>
</svg>
