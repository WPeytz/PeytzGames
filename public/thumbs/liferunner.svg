<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="LifeRunner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="0.5" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e94560"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ffd700"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#e94560" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="time" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="money" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- winding life path from start (bottom-left) to goal (top-right) -->
  <path d="M70 360 C 200 360, 200 250, 330 250 S 470 250, 540 180 S 660 110, 720 110"
        fill="none" stroke="#0b1020" stroke-width="30" stroke-linecap="round" opacity="0.5"/>
  <path d="M70 360 C 200 360, 200 250, 330 250 S 470 250, 540 180 S 660 110, 720 110"
        fill="none" stroke="url(#brand)" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="2 26"/>
  <path d="M70 360 C 200 360, 200 250, 330 250 S 470 250, 540 180 S 660 110, 720 110"
        fill="none" stroke="url(#brand)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- milestone choice nodes along the path -->
  <g>
    <circle cx="200" cy="307" r="10" fill="#16213e" stroke="url(#brand)" stroke-width="4"/>
    <circle cx="330" cy="250" r="10" fill="#16213e" stroke="url(#brand)" stroke-width="4"/>
    <circle cx="470" cy="218" r="10" fill="#16213e" stroke="url(#brand)" stroke-width="4"/>
    <circle cx="600" cy="150" r="10" fill="#16213e" stroke="url(#brand)" stroke-width="4"/>
  </g>

  <!-- runner marker at the start of the journey -->
  <g transform="translate(70 360)">
    <circle r="22" fill="url(#brand)"/>
    <circle r="22" fill="none" stroke="#fff" stroke-width="2" opacity="0.35"/>
    <g fill="#1a1a2e">
      <circle cx="0" cy="-7" r="4.5"/>
      <path d="M-1 -3 q-2 6 -6 9 M1 -3 q3 5 7 6 M0 -3 v8 M0 5 l-5 9 M0 5 l5 9" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- goal flag -->
  <g transform="translate(720 110)">
    <line x1="0" y1="6" x2="0" y2="-46" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 -44 L34 -36 L0 -22 Z" fill="url(#brand)"/>
    <circle cx="0" cy="6" r="6" fill="#cbd5e1"/>
  </g>

  <!-- resource meters: time, energy, money -->
  <g transform="translate(56 56)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- time -->
    <g>
      <circle cx="14" cy="12" r="11" fill="none" stroke="url(#time)" stroke-width="3"/>
      <path d="M14 12 V5 M14 12 h5" stroke="url(#time)" stroke-width="3" stroke-linecap="round" fill="none"/>
      <rect x="34" y="6" width="150" height="12" rx="6" fill="#0b1020"/>
      <rect x="34" y="6" width="108" height="12" rx="6" fill="url(#time)"/>
    </g>
    <!-- energy -->
    <g transform="translate(0 34)">
      <path d="M16 1 L7 14 h7 l-3 11 13 -16 h-7 z" fill="url(#energy)"/>
      <rect x="34" y="6" width="150" height="12" rx="6" fill="#0b1020"/>
      <rect x="34" y="6" width="78" height="12" rx="6" fill="url(#energy)"/>
    </g>
    <!-- money -->
    <g transform="translate(0 68)">
      <circle cx="14" cy="12" r="11" fill="none" stroke="url(#money)" stroke-width="3"/>
      <text x="14" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="url(#money)">$</text>
      <rect x="34" y="6" width="150" height="12" rx="6" fill="#0b1020"/>
      <rect x="34" y="6" width="126" height="12" rx="6" fill="url(#money)"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="744" y="400" text-anchor="end"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800"
        fill="url(#brand)" letter-spacing="-1">LifeRunner</text>
</svg>
