<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="PeytzPvP">
  <defs>
    <linearGradient id="pvp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15101a"/>
      <stop offset="1" stop-color="#0a0709"/>
    </linearGradient>
    <radialGradient id="pvp-clash" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ef4444" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pvp-blade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#pvp-bg)"/>
  <ellipse cx="400" cy="278" rx="360" ry="240" fill="url(#pvp-clash)"/>

  <!-- pixel arena floor -->
  <g fill="#1c2a16" stroke="#0f1a0c" stroke-width="2">
    <rect x="0" y="390" width="60" height="60"/><rect x="60" y="390" width="60" height="60" fill="#233516"/>
    <rect x="120" y="390" width="60" height="60"/><rect x="180" y="390" width="60" height="60" fill="#233516"/>
    <rect x="240" y="390" width="60" height="60"/><rect x="300" y="390" width="60" height="60" fill="#233516"/>
    <rect x="360" y="390" width="60" height="60"/><rect x="420" y="390" width="60" height="60" fill="#233516"/>
    <rect x="480" y="390" width="60" height="60"/><rect x="540" y="390" width="60" height="60" fill="#233516"/>
    <rect x="600" y="390" width="60" height="60"/><rect x="660" y="390" width="60" height="60" fill="#233516"/>
    <rect x="720" y="390" width="60" height="60"/>
  </g>

  <!-- soft clash glow at the crossing point (behind the blades) -->
  <circle cx="400" cy="244" r="70" fill="#fde68a" opacity="0.10"/>

  <!-- crossed diamond swords (Minecraft-style, blocky) -->
  <!-- each sword: pommel at origin pointing up; inner shift puts the blade
       mid-point on the rotation origin so the two cross in an X -->
  <g stroke="#0a0709" stroke-width="2" stroke-linejoin="round">
    <g transform="translate(400 244) rotate(-33)">
      <g transform="translate(0 121)">
        <rect x="-7" y="-58" width="14" height="58" fill="#6b4423"/>            <!-- handle -->
        <rect x="-30" y="-74" width="60" height="16" fill="#d4a017"/>           <!-- guard -->
        <rect x="-12" y="-214" width="24" height="140" fill="url(#pvp-blade)"/> <!-- blade -->
        <polygon points="-12,-214 12,-214 0,-242" fill="url(#pvp-blade)"/>      <!-- tip -->
        <rect x="-3" y="-210" width="4" height="132" fill="#e0fbff" stroke="none" opacity="0.8"/>
      </g>
    </g>
    <g transform="translate(400 244) rotate(33)">
      <g transform="translate(0 121)">
        <rect x="-7" y="-58" width="14" height="58" fill="#6b4423"/>
        <rect x="-30" y="-74" width="60" height="16" fill="#d4a017"/>
        <rect x="-12" y="-214" width="24" height="140" fill="url(#pvp-blade)"/>
        <polygon points="-12,-214 12,-214 0,-242" fill="url(#pvp-blade)"/>
        <rect x="-1" y="-210" width="4" height="132" fill="#e0fbff" stroke="none" opacity="0.8"/>
      </g>
    </g>
  </g>

  <!-- impact spark where the blades cross -->
  <g stroke="#fef3c7" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="400" y1="214" x2="400" y2="200"/>
    <line x1="424" y1="222" x2="436" y2="214"/>
    <line x1="376" y1="222" x2="364" y2="214"/>
  </g>
  <circle cx="400" cy="244" r="7" fill="#fff7ed"/>

  <!-- brand label -->
  <text x="64" y="74" font-family="'Geist','Inter',system-ui,sans-serif"
    font-size="30" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#f5f7fb">Peytz</tspan><tspan fill="#ef4444">PvP</tspan>
  </text>

  <!-- hardcore hearts -->
  <g transform="translate(596 44)">
    <g fill="#ef4444" stroke="#7f1d1d" stroke-width="2">
      <path d="M0 6 C0 0 -8 -2 -8 5 C-8 11 0 16 0 16 C0 16 8 11 8 5 C8 -2 0 0 0 6 Z"/>
      <path d="M28 6 C28 0 20 -2 20 5 C20 11 28 16 28 16 C28 16 36 11 36 5 C36 -2 28 0 28 6 Z"/>
      <path d="M56 6 C56 0 48 -2 48 5 C48 11 56 16 56 16 C56 16 64 11 64 5 C64 -2 56 0 56 6 Z"/>
    </g>
  </g>
</svg>
